{% extends "base.html" %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-8">

        <div class="card shadow">

            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">Add New Student</h4>
            </div>

            <div class="card-body">

                <form method="POST">

                    <div class="row">

                        <div class="col-md-6 mb-3">
                            <label class="form-label">
                                Student ID
                            </label>

                            <input
                                type="text"
                                name="student_id"
                                class="form-control"
                                required
                            >
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">
                                Student Name
                            </label>

                            <input
                                type="text"
                                name="student_name"
                                class="form-control"
                                required
                            >
                        </div>

                    </div>

                    <div class="row">

                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                Gender
                            </label>

                            <select
                                name="gender"
                                class="form-select"
                                required
                            >
                                <option value="">
                                    Select Gender
                                </option>

                                <option value="Male">
                                    Male
                                </option>

                                <option value="Female">
                                    Female
                                </option>

                            </select>

                        </div>

                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                Age
                            </label>

                            <input
                                type="number"
                                name="age"
                                class="form-control"
                                required
                            >

                        </div>

                    </div>

                    <div class="row">

                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                Tuition Fees Up To Date
                            </label>

                            <select
                                name="tuition_fees"
                                class="form-select"
                            >
                                <option value="1">
                                    Yes
                                </option>

                                <option value="0">
                                    No
                                </option>

                            </select>

                        </div>

                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                Scholarship Holder
                            </label>

                            <select
                                name="scholarship"
                                class="form-select"
                            >
                                <option value="1">
                                    Yes
                                </option>

                                <option value="0">
                                    No
                                </option>

                            </select>

                        </div>

                    </div>

                    <div class="row">

                        <div class="col-md-4 mb-3">

                            <label class="form-label">
                                Admission Grade
                            </label>

                            <input
                                type="number"
                                step="0.01"
                                name="admission_grade"
                                class="form-control"
                                required
                            >

                        </div>

                        <div class="col-md-4 mb-3">

                            <label class="form-label">
                                1st Sem Approved Units
                            </label>

                            <input
                                type="number"
                                name="first_sem"
                                class="form-control"
                                required
                            >

                        </div>

                        <div class="col-md-4 mb-3">

                            <label class="form-label">
                                2nd Sem Approved Units
                            </label>

                            <input
                                type="number"
                                name="second_sem"
                                class="form-control"
                                required
                            >

                        </div>

                    </div>

                    <div class="d-flex gap-2">

                        <button
                            type="submit"
                            class="btn btn-success"
                        >
                            Save Student
                        </button>

                        <a
                            href="/students"
                            class="btn btn-secondary"
                        >
                            Back to Students
                        </a>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
