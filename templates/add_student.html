<!DOCTYPE html>
<html>
<head>
    <title>Add Student</title>
</head>
<body>

<h1>Add Student</h1>

<form method="POST">

    <label>Student ID</label><br>
    <input type="text" name="student_id" required><br><br>

    <label>Student Name</label><br>
    <input type="text" name="student_name" required><br><br>

    <label>Gender</label><br>

    <select name="gender" required>
        <option value="">Select Gender</option>
        <option value="Male">Male</option>
        <option value="Female">Female</option>
    </select>

    <label>Age</label><br>
    <input type="number" name="age" required><br><br>

    <label>Tuition Fees Up To Date</label><br>
    <select name="tuition_fees">
        <option value="1">Yes</option>
        <option value="0">No</option>
    </select><br><br>

    <label>Scholarship Holder</label><br>
    <select name="scholarship">
        <option value="1">Yes</option>
        <option value="0">No</option>
    </select><br><br>

    <label>Admission Grade</label><br>
    <input type="number" step="0.01" name="admission_grade" required><br><br>

    <label>1st Sem Approved Units</label><br>
    <input type="number" name="first_sem" required><br><br>

    <label>2nd Sem Approved Units</label><br>
    <input type="number" name="second_sem" required><br><br>

    <button type="submit">
        Save Student
    </button>

</form>

<br>

<a href="/students">View Students</a>

</body>
<link rel="stylesheet"
href="{{ url_for('static', filename='style.css') }}">
</html>
